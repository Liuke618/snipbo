name: CI

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (arm64)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.SNIPBO_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SNIPBO_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "error: signing secrets are not configured" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/signing.p12" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain-db
          security find-certificate -c "Snipbo Local Signing" -p build.keychain \
            > "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          security find-identity -v -p codesigning | grep "Snipbo Local Signing"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-cert.pem"

      - name: Build app bundle
        env:
          SNIPBO_SIGN_IDENTITY: Snipbo Local Signing
        run: ./scripts/build_app.sh

      - name: Show app signature
        run: codesign -dv --verbose=2 dist/Snipbo.app

      - name: Package app
        run: |
          ditto -c -k --keepParent dist/Snipbo.app Snipbo-arm64.zip
          shasum -a 256 Snipbo-arm64.zip | tee Snipbo-arm64.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Snipbo-arm64
          path: |
            Snipbo-arm64.zip
            Snipbo-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
