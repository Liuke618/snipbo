name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a tag run mid-release; only branch runs are superseded.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Run tests
        run: swift test

  package:
    name: Build and package (arm64)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.SNIPBO_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SNIPBO_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "error: signing secrets are not configured" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/signing.p12" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain-db
          security find-certificate -c "Snipbo Local Signing" -p build.keychain \
            > "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          security find-identity -v -p codesigning | grep "Snipbo Local Signing"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-cert.pem"

      - name: Build app bundle
        env:
          SNIPBO_SIGN_IDENTITY: Snipbo Local Signing
        run: ./scripts/build_app.sh

      - name: Verify app signature
        run: |
          codesign -dv --verbose=2 dist/Snipbo.app
          codesign --verify --deep --strict --verbose=2 dist/Snipbo.app

      - name: Package app
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            dist/Snipbo.app/Contents/Info.plist)"
          # The asset name is what the in-app updater matches; it must use the
          # version in the tag, not an untagged build's version.
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
            exit 1
          fi
          ZIP="Snipbo-$VERSION-arm64.zip"
          ditto -c -k --keepParent dist/Snipbo.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Snipbo-arm64
          path: |
            Snipbo-*-arm64.zip
            Snipbo-*-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The annotated tag body carries the release notes. Create the tag
          # with `git tag -a vX.Y.Z -F notes.md --cleanup=verbatim` so Markdown
          # headings survive git's comment stripping.
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: Snipbo-arm64
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ZIP="release/Snipbo-$VERSION-arm64.zip"
          SHA="$ZIP.sha256"
          test -f "$ZIP"
          test -f "$SHA"

          # Prefer the curated release notes in the annotated tag's body; a
          # tag without a body falls back to GitHub's generated notes.
          NOTES_ARGS=(--generate-notes)
          BODY="$(git tag -l --format='%(contents:body)' "$TAG")"
          if [[ -n "${BODY//[[:space:]]/}" ]]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
            NOTES_ARGS=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            if [[ -f "$RUNNER_TEMP/notes.md" ]]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --title "Snipbo $VERSION" \
              "${NOTES_ARGS[@]}"
          fi
